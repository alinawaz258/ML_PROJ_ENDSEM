# =============================================================
# Configuration File — Tomato Leaf Disease Detection
# =============================================================
# This is the single source of truth for all pipeline parameters.
# Every module reads from this file. No hardcoded values in code.
# =============================================================

project:
  name: "Tomato Leaf Disease Detection"
  version: "1.0.0"
  author: "ML Research Team"
  description: "AI-Based Tomato Leaf Disease Detection using ML and DL"

paths:
  dataset_root: "archive/PlantVillage"
  output_dir: "artifacts"
  models_dir: "artifacts/models"
  figures_dir: "artifacts/figures"
  reports_dir: "artifacts/reports"
  logs_dir: "artifacts/logs"
  features_dir: "artifacts/features"

dataset:
  classes:
    - "Tomato_Bacterial_spot"
    - "Tomato_Early_blight"
    - "Tomato_Late_blight"
    - "Tomato_Leaf_Mold"
    - "Tomato_Septoria_leaf_spot"
    - "Tomato_Spider_mites_Two_spotted_spider_mite"
    - "Tomato__Target_Spot"
    - "Tomato__Tomato_YellowLeaf__Curl_Virus"
    - "Tomato__Tomato_mosaic_virus"
    - "Tomato_healthy"
  class_labels:
    - "Bacterial Spot"
    - "Early Blight"
    - "Late Blight"
    - "Leaf Mold"
    - "Septoria Leaf Spot"
    - "Spider Mites"
    - "Target Spot"
    - "Yellow Leaf Curl Virus"
    - "Mosaic Virus"
    - "Healthy"
  num_classes: 10
  valid_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_state: 42

preprocessing:
  image_size: [128, 128]
  color_mode: "rgb"
  normalize: true
  normalization_method: "minmax"  # "minmax" or "standardize"

features:
  hog:
    orientations: 9
    pixels_per_cell: [16, 16]
    cells_per_block: [2, 2]
    block_norm: "L2-Hys"
    visualize: true
  lbp:
    num_points: 24
    radius: 3
    method: "uniform"
  color_histogram:
    bins: [32, 32, 32]
    color_space: "hsv"  # "rgb" or "hsv"
  pca:
    n_components: 50
    whiten: false
    random_state: 42

classical_ml:
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
    probability: true
    random_state: 42
  random_forest:
    n_estimators: 200
    max_depth: null
    min_samples_split: 5
    random_state: 42
    n_jobs: -1
  decision_tree:
    criterion: "gini"
    max_depth: 15
    min_samples_split: 5
    random_state: 42
  adaboost:
    n_estimators: 100
    learning_rate: 0.1
    random_state: 42
  gradient_boosting:
    n_estimators: 150
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  bayesian_logistic:
    max_iter: 1000
    tol: 0.001
    random_state: 42
  linear_regression:
    random_state: 42
  cross_validation:
    n_folds: 5
    scoring: "f1_weighted"

clustering:
  kmeans:
    n_clusters: 10
    n_init: 10
    max_iter: 300
    random_state: 42
  gmm:
    n_components: 10
    covariance_type: "full"
    max_iter: 200
    random_state: 42
  hierarchical:
    n_clusters: 10
    linkage: "ward"

sequential:
  hmm:
    n_components: 10
    n_iter: 100
    random_state: 42

deep_learning:
  image_size: [128, 128]
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  custom_cnn:
    filters: [32, 64, 128]
    kernel_size: 3
    pool_size: 2
    dense_units: 256
    dropout_rate: 0.5
  efficientnet:
    weights: "imagenet"
    trainable_layers: 20
    fine_tune_lr: 0.0001
  callbacks:
    early_stopping:
      monitor: "val_loss"
      patience: 5
      restore_best_weights: true
    reduce_lr:
      monitor: "val_loss"
      factor: 0.2
      patience: 3
      min_lr: 0.00001
  augmentation:
    rotation_range: 30
    width_shift_range: 0.2
    height_shift_range: 0.2
    horizontal_flip: true
    vertical_flip: false
    zoom_range: 0.2
    fill_mode: "nearest"

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
  average: "weighted"
  confusion_matrix: true
  roc_curve: true
  classification_report: true

visualization:
  figure_size: [12, 8]
  dpi: 150
  style: "seaborn-v0_8-whitegrid"
  colormap: "viridis"
  save_format: "png"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "artifacts/logs/pipeline.log"
